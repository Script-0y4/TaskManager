<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard | Gestión de Tareas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="dashboard.css">
</head>

<body>

<div class="layout">

<aside class="sidebar">

<div class="logo">TaskManager</div>

<nav class="menu">
<a href="#" class="active">Inicio</a>
</nav>

<a href="#" class="logout" onclick="cerrarSesion()">Cerrar sesión</a>

</aside>

<main class="main">

<header class="topbar">
<h1>Panel de Tareas</h1>
<span class="user">Usuario: <span id="nombreUsuario"></span></span>
</header>


<section class="stats">

<div class="card">
<h3>Total de Tareas</h3>
<p class="number" id="total">0</p>
<span class="detail">Actualizado hoy</span>
</div>

<div class="card">
<h3>Pendientes</h3>
<p class="number" id="pendientes">0</p>
<span class="detail">Requieren atención</span>
</div>

<div class="card">
<h3>Completadas</h3>
<p class="number" id="completadas">0</p>
<span class="detail">Finalizadas</span>
</div>

</section>


<section class="table-section">

<h2>Listado de Tareas</h2>

<div class="table-container">

<table>

<thead>
<tr>
<th>ID</th>
<th>Tarea</th>
<th>Responsable</th>
<th>Estado</th>
</tr>
</thead>

<tbody id="tablaTareas">
</tbody>

</table>

</div>

</section>

</main>

</div>


<script>

const usuario = localStorage.getItem("usuario");

if(!usuario){
window.location.href = "login.html";
}

document.getElementById("nombreUsuario").innerText = usuario;


async function cargarTareas(){

const res = await fetch("http://localhost:3000/tareas");
const tareas = await res.json();

const tabla = document.getElementById("tablaTareas");
tabla.innerHTML = "";

let total = tareas.length;
let pendientes = 0;
let completadas = 0;

tareas.forEach(t => {

let claseEstado = t.estado === "Pendiente" ? "estado-pendiente" : "estado-completada";

if(t.estado === "Pendiente"){
pendientes++;
}else{
completadas++;
}

tabla.innerHTML += `
<tr>
<td>#${t.id}</td>
<td>${t.titulo}</td>
<td>${t.usuario}</td>
<td><span class="${claseEstado}">${t.estado}</span></td>
</tr>
`;

});

document.getElementById("total").innerText = total;
document.getElementById("pendientes").innerText = pendientes;
document.getElementById("completadas").innerText = completadas;

}

cargarTareas();


function cerrarSesion(){
localStorage.removeItem("usuario");
window.location.href = "login.html";
}

</script>

</body>
</html>
